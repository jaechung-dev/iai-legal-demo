name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'main.py'
              - 'requirements.txt'
              - 'auth.py'
              - 'mcp_server.py'
            frontend:
              - 'frontend/**'

  deploy-backend:
    name: Deploy Lambda
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lambda.zip
        run: bash build_lambda.sh

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo $TOKEN | cut -d. -f2 | python3 -c "import sys,base64,json; d=sys.stdin.read().strip(); d+='=='*((4-len(d)%4)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(d)), indent=2))")
          echo "sub: $(echo $PAYLOAD | python3 -c "import sys,json; print(json.load(sys.stdin)['sub'])")"
          echo "aud: $(echo $PAYLOAD | python3 -c "import sys,json; print(json.load(sys.stdin)['aud'])")"
          echo "iss: $(echo $PAYLOAD | python3 -c "import sys,json; print(json.load(sys.stdin)['iss'])")"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name iai-legal-demo \
            --zip-file fileb://lambda.zip \
            --output text

  deploy-frontend:
    name: Deploy Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload to S3 (assets — long cache)
        run: |
          aws s3 sync frontend/out/ s3://${{ secrets.S3_BUCKET }}/ --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.json"

      - name: Upload to S3 (HTML/JSON — no cache)
        run: |
          aws s3 sync frontend/out/ s3://${{ secrets.S3_BUCKET }}/ \
            --cache-control "no-cache" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_ID }} \
            --paths "/*" \
            --output text
